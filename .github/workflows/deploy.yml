name: Auto Deploy to GitHub Pages

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Sync static files to gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout gh-pages 2>/dev/null || git checkout --orphan gh-pages
          git rm -rf --cached . >/dev/null 2>&1 || true
          find . -mindepth 1 -maxdepth 1 ! -name '.git' ! -name '.github' -exec rm -rf {} +
          git checkout main -- index.html style.css sw.js manifest.json icon.png icon-192.png icon-512.png icon.svg apple-touch-icon.png pdf-decrypt.bundle.js
          git add -A
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "auto deploy: $(date -u +%Y%m%d-%H%M%S)"
            git push origin gh-pages
          fi
